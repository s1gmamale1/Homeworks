<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980" role="img" aria-labelledby="title desc">
  <title id="title">Ko'phadlarni ko'paytuvchilarga ajratish usullari</title>
  <desc id="desc">Four clean algebra factorization methods: common factor, grouping, difference of squares, and perfect square trinomial.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eaf4ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#0f8a6c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;letter-spacing:0}
      .ink{fill:#17324d}
      .muted{fill:#5d7188}
      .eyebrow{font-size:24px;font-weight:800;letter-spacing:.08em}
      .title{font-size:40px;font-weight:850}
      .body{font-size:25px}
      .cardTitle{font-size:25px;font-weight:820}
      .formula{font-size:34px;font-weight:850}
      .sub{font-size:24px}
      .card{fill:#fff;stroke:#d7e6f7;stroke-width:3}
      .arrow{fill:none;stroke:#2f86dc;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="900" height="980" rx="36" fill="url(#bg)"/>
  <circle cx="108" cy="118" r="58" fill="#d9ecff" opacity=".55"/>
  <circle cx="788" cy="842" r="78" fill="#d7f4ea" opacity=".58"/>

  <text x="58" y="74" class="eyebrow" fill="#0066cc">ALGEBRA · 7-SINF</text>
  <text x="58" y="124" class="title ink">Ko'phadlarni ajratish</text>
  <text x="58" y="164" class="body muted">Avval ko'rinishni tanlang, keyin mos usulni qo'llang.</text>

  <g filter="url(#softShadow)">
    <rect x="198" y="220" width="504" height="126" rx="28" fill="url(#core)"/>
    <text x="270" y="270" class="eyebrow" fill="#dff3ff">BOSHLASH</text>
    <text x="270" y="318" class="formula" fill="#ffffff">Ko'phad → ko'paytma</text>
  </g>

  <path class="arrow" d="M344 346 L252 424"/>
  <path class="arrow" d="M556 346 L648 424"/>
  <path class="arrow" d="M344 346 C250 520 240 606 240 682"/>
  <path class="arrow" d="M556 346 C650 520 660 606 660 682"/>

  <g filter="url(#softShadow)">
    <rect class="card" x="92" y="430" width="326" height="174" rx="24"/>
    <circle cx="130" cy="476" r="15" fill="#0066cc"/>
    <text x="164" y="486" class="cardTitle ink">Umumiy omil</text>
    <text x="130" y="544" class="formula ink">ax + ay</text>
    <text x="130" y="584" class="sub muted">= a(x + y)</text>
  </g>

  <g filter="url(#softShadow)">
    <rect class="card" x="482" y="430" width="326" height="174" rx="24"/>
    <circle cx="520" cy="476" r="15" fill="#0f8a6c"/>
    <text x="554" y="486" class="cardTitle ink">Guruhlash</text>
    <text x="520" y="542" class="sub ink">ax + ay + bx + by</text>
    <text x="520" y="584" class="sub muted">= (a+b)(x+y)</text>
  </g>

  <g filter="url(#softShadow)">
    <rect class="card" x="92" y="682" width="326" height="174" rx="24"/>
    <circle cx="130" cy="728" r="15" fill="#b66a00"/>
    <text x="164" y="738" class="cardTitle ink">Kvadratlar ayirmasi</text>
    <text x="130" y="796" class="formula ink">a² - b²</text>
    <text x="130" y="836" class="sub muted">= (a-b)(a+b)</text>
  </g>

  <g filter="url(#softShadow)">
    <rect class="card" x="482" y="682" width="326" height="174" rx="24"/>
    <circle cx="520" cy="728" r="15" fill="#c9352b"/>
    <text x="554" y="738" class="cardTitle ink">To'liq kvadrat</text>
    <text x="520" y="794" class="sub ink">a² + 2ab + b²</text>
    <text x="520" y="836" class="sub muted">= (a+b)²</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="88" y="890" width="724" height="58" rx="22" fill="#ffffff" stroke="#d7e6f7" stroke-width="3"/>
    <text x="132" y="928" class="sub ink">Tekshiruv: ko'paytirib oching — boshlang'ich ko'phad qaytishi kerak.</text>
  </g>
</svg>
