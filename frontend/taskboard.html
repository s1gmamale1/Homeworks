<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Taskboard · NETS</title>
  <link rel="stylesheet" href="/css/app.css?v=__VERSION__">
  <link rel="stylesheet" href="/css/taskboard.css?v=__VERSION__">
</head>
<body data-page="taskboard">
  <div class="app-shell">
    <header class="topbar glass-card">
      <div class="brand-block">
        <a class="brand-mark" href="/landing.html" data-i18n-aria-label="common.landing_aria" aria-label="Open landing page">N</a>
        <div>
          <p class="eyebrow" data-i18n="common.brand_eyebrow">NETS Homework Builder</p>
          <h1 data-i18n="taskboard.page_title">Taskboard</h1>
        </div>
      </div>

      <nav class="topbar-nav" aria-label="Site navigation">
        <a class="btn btn-ghost" href="/index.html" data-i18n="common.dashboard">Dashboard</a>
        <a class="btn btn-ghost" href="/library.html" data-i18n="common.library">Library</a>
        <a class="btn btn-ghost is-active" href="/taskboard.html" aria-current="page" data-i18n="common.taskboard">Taskboard</a>
      </nav>

      <div class="topbar-actions">
        <div class="lang-switch" role="group" data-i18n-aria-label="common.lang_aria" aria-label="Language">
          <button type="button" class="lang-pill" data-lang="uz">UZ</button>
          <button type="button" class="lang-pill" data-lang="ru">RU</button>
          <button type="button" class="lang-pill" data-lang="en">EN</button>
        </div>
        <button class="btn btn-ghost theme-toggle" data-theme-toggle type="button" aria-label="Switch to dark mode" aria-pressed="false">🌙</button>
      </div>
    </header>

    <main class="taskboard-shell">
      <div class="taskboard-header glass-card">
        <div class="taskboard-header-text">
          <h1 class="taskboard-title" data-i18n="taskboard.h1">Taskboard</h1>
          <p class="eyebrow muted-text" data-i18n="taskboard.subtitle">Internal task board · drag to assign</p>
        </div>
        <div class="taskboard-actions">
          <button class="btn btn-primary" id="tb-new-task" data-i18n="taskboard.new_task">+ New task</button>
          <button class="btn btn-ghost" id="tb-new-user" data-i18n="taskboard.new_user">+ New person</button>
        </div>
      </div>

      <section
        class="tb-board"
        id="tb-board"
        role="list"
        data-i18n-aria-label="taskboard.board_aria"
        aria-label="Kanban board"
      >
        <!-- rendered by JS: pinned "Issues" column + one column per user -->
      </section>
    </main>

    <nav class="tb-bottom-dock glass-card" aria-label="Taskboard navigation dock">
      <a class="tb-dock-btn" href="/index.html" data-i18n-aria-label="taskboard.dock.inbox" aria-label="Inbox">
        <span class="tb-dock-icon" aria-hidden="true">📥</span>
        <span class="tb-dock-label" data-i18n="taskboard.dock.inbox">Inbox</span>
      </a>
      <a class="tb-dock-btn" href="/library.html" data-i18n-aria-label="taskboard.dock.planner" aria-label="Planner">
        <span class="tb-dock-icon" aria-hidden="true">🗓️</span>
        <span class="tb-dock-label" data-i18n="taskboard.dock.planner">Planner</span>
      </a>
      <a class="tb-dock-btn is-active" href="/taskboard.html" aria-current="page" data-i18n-aria-label="taskboard.dock.board" aria-label="Board">
        <span class="tb-dock-icon" aria-hidden="true">📋</span>
        <span class="tb-dock-label" data-i18n="taskboard.dock.board">Board</span>
      </a>
      <button class="tb-dock-btn" id="tb-switch-boards" type="button" data-i18n-aria-label="taskboard.dock.switch" aria-label="Switch boards">
        <span class="tb-dock-icon" aria-hidden="true">🔀</span>
        <span class="tb-dock-label" data-i18n="taskboard.dock.switch">Switch boards</span>
      </button>
    </nav>

    <dialog id="tb-task-modal" class="tb-modal glass-card">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="tb-task-modal-title" data-i18n="taskboard.task_modal_title">New task</h2>
          <button class="icon-btn" id="tb-close-task-modal" type="button" data-i18n-aria-label="common.close" aria-label="Close">×</button>
        </div>
        <div class="modal-body">
          <label class="field-label" for="tb-task-title" data-i18n="taskboard.task_title_label">Title</label>
          <input type="text" class="text-input" id="tb-task-title" data-i18n-placeholder="taskboard.task_title_placeholder" placeholder="What needs to be done?">

          <label class="field-label" for="tb-task-desc" data-i18n="taskboard.task_desc_label">Description</label>
          <textarea class="text-input" id="tb-task-desc" rows="3" data-i18n-placeholder="taskboard.task_desc_placeholder" placeholder="Optional details…"></textarea>

          <div class="tb-modal-row">
            <div class="tb-modal-col">
              <label class="field-label" for="tb-task-type" data-i18n="taskboard.task_type_label">Type</label>
              <select class="text-input" id="tb-task-type">
                <option value="general" data-i18n="taskboard.type.general">General</option>
                <option value="development" data-i18n="taskboard.type.development">Development</option>
                <option value="design" data-i18n="taskboard.type.design">Design</option>
                <option value="research" data-i18n="taskboard.type.research">Research</option>
                <option value="ops" data-i18n="taskboard.type.ops">Ops</option>
              </select>
            </div>
            <div class="tb-modal-col">
              <label class="field-label" for="tb-task-assignee" data-i18n="taskboard.task_assignee_label">Assigned to</label>
              <select class="text-input" id="tb-task-assignee">
                <!-- rendered by JS: Issues + each active user -->
              </select>
            </div>
          </div>

          <div class="tb-modal-row">
            <div class="tb-modal-col">
              <label class="field-label" for="tb-task-subtotal" data-i18n="taskboard.task_subtask_total_label">Sub-tasks total</label>
              <input type="number" class="text-input" id="tb-task-subtotal" min="0" max="999" step="1" placeholder="0">
            </div>
            <div class="tb-modal-col">
              <label class="field-label" for="tb-task-subdone" data-i18n="taskboard.task_subtask_done_label">Sub-tasks done</label>
              <input type="number" class="text-input" id="tb-task-subdone" min="0" max="999" step="1" placeholder="0">
            </div>
            <div class="tb-modal-col">
              <label class="field-label" for="tb-task-attach" data-i18n="taskboard.task_attach_label">Attachments</label>
              <input type="number" class="text-input" id="tb-task-attach" min="0" max="999" step="1" placeholder="0">
            </div>
          </div>

          <label class="field-label" for="tb-task-cover" data-i18n="taskboard.task_cover_label">Cover image URL (optional)</label>
          <input type="text" class="text-input" id="tb-task-cover" data-i18n-placeholder="taskboard.task_cover_placeholder" placeholder="https://…">
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="tb-cancel-task" type="button" data-i18n="common.cancel">Cancel</button>
          <button class="btn btn-primary" id="tb-save-task" type="button" data-i18n="taskboard.save_task">Save</button>
        </div>
      </div>
    </dialog>

    <dialog id="tb-user-modal" class="tb-modal glass-card">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="tb-user-modal-title" data-i18n="taskboard.user_modal_title">New person</h2>
          <button class="icon-btn" id="tb-close-user-modal" type="button" data-i18n-aria-label="common.close" aria-label="Close">×</button>
        </div>
        <div class="modal-body">
          <label class="field-label" for="tb-user-name" data-i18n="taskboard.user_name_label">Name</label>
          <input type="text" class="text-input" id="tb-user-name" data-i18n-placeholder="taskboard.user_name_placeholder" placeholder="e.g. Karim">

          <label class="field-label" data-i18n="taskboard.user_color_label">Accent colour</label>
          <div class="tb-color-swatches" id="tb-user-color-swatches" role="radiogroup" aria-label="Accent colour">
            <!-- rendered by JS -->
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="tb-cancel-user" type="button" data-i18n="common.cancel">Cancel</button>
          <button class="btn btn-primary" id="tb-save-user" type="button" data-i18n="taskboard.save_user">Save</button>
        </div>
      </div>
    </dialog>
  </div>

  <script src="/js/i18n/strings.js?v=__VERSION__"></script>
  <script src="/js/i18n.js?v=__VERSION__"></script>
  <script src="/js/api.js?v=__VERSION__"></script>
  <script src="/js/theme.js?v=__VERSION__"></script>
  <script src="/js/taskboard.js?v=__VERSION__" type="module"></script>
</body>
</html>
