<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets env(safe-area-inset-*) resolve to non-zero
       on notched iPhones. The mobile FAB rule in app.css adds
       env(safe-area-inset-bottom) so the home indicator does not cover
       the "Add" button — that env() would be 0 without this attribute. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n="builder.page_title">NETS Builder · Homework Editor</title>
  <link rel="stylesheet" href="/css/app.css?v=__VERSION__" />
  <script src="/js/theme.js?v=__VERSION__"></script>
  <script src="/js/katex-render.js?v=__VERSION__"></script>
  <script src="/js/mathlive-bootstrap.js?v=__VERSION__"></script>
</head>
<body data-page="builder">
  <main class="builder-shell">
    <section class="sidebar glass-card" aria-label="Homework phases">
      <div class="sidebar-header">
        <a class="btn btn-ghost" href="/index.html" data-i18n-aria-label="builder.back_to_dashboard" aria-label="Back to dashboard" data-i18n="builder.back_link">← Dashboard</a>
        <div>
          <p class="eyebrow" data-i18n="builder.sidebar_eyebrow">Builder</p>
          <h1 id="sidebar-title" data-i18n="common.loading">Loading…</h1>
        </div>
        <div class="pill-row" id="sidebar-meta">
          <span class="status-pill" data-status="draft">
            <span class="status-dot draft"></span>
            <span data-i18n="common.draft">Draft</span>
          </span>
        </div>
      </div>

      <nav class="phase-list" id="phase-list" aria-label="Phase navigation" aria-busy="true">
        <!-- Placeholder phase rows — replaced by renderPhases() once
             loadHomework() returns and the real pipeline is known. -->
        <div class="phase-list-skeleton" aria-hidden="true">
          <div class="skeleton-card" style="padding:12px;min-height:48px;flex-direction:row;align-items:center;gap:12px">
            <span class="skeleton-orb" style="height:28px;width:28px"></span>
            <span class="skeleton-bar" style="flex:1;height:14px;width:auto"></span>
          </div>
          <div class="skeleton-card" style="padding:12px;min-height:48px;flex-direction:row;align-items:center;gap:12px">
            <span class="skeleton-orb" style="height:28px;width:28px"></span>
            <span class="skeleton-bar" style="flex:1;height:14px;width:auto"></span>
          </div>
          <div class="skeleton-card" style="padding:12px;min-height:48px;flex-direction:row;align-items:center;gap:12px">
            <span class="skeleton-orb" style="height:28px;width:28px"></span>
            <span class="skeleton-bar" style="flex:1;height:14px;width:auto"></span>
          </div>
          <div class="skeleton-card" style="padding:12px;min-height:48px;flex-direction:row;align-items:center;gap:12px">
            <span class="skeleton-orb" style="height:28px;width:28px"></span>
            <span class="skeleton-bar" style="flex:1;height:14px;width:auto"></span>
          </div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <p class="save-state" id="save-state" data-i18n="builder.idle">Idle</p>
      </div>
    </section>

    <section class="builder-main glass-card" aria-label="Homework builder workspace">
      <header class="builder-topbar">
        <div class="builder-title-block">
          <p class="eyebrow" id="builder-subtitle" data-i18n="builder.subtitle">Homework</p>
          <h2 id="builder-title" data-i18n="builder.title_loading">Loading homework…</h2>
        </div>

        <div class="builder-actions">
          <div class="lang-switch" role="group" data-i18n-aria-label="common.lang_aria" aria-label="Language">
            <button type="button" class="lang-pill" data-lang="uz">UZ</button>
            <button type="button" class="lang-pill" data-lang="ru">RU</button>
            <button type="button" class="lang-pill" data-lang="en">EN</button>
          </div>
          <a class="btn btn-ghost" href="/taskboard.html" data-i18n="common.taskboard">Taskboard</a>
          <button class="btn btn-ghost theme-toggle" data-theme-toggle type="button" aria-label="Switch to dark mode" aria-pressed="false">🌙</button>
          <div class="save-indicator" id="save-indicator" data-state="idle" role="status" aria-live="polite">
            <span class="save-dot" aria-hidden="true"></span>
            <span class="save-text" data-i18n="common.loading">Loading…</span>
          </div>
          <button class="btn btn-ghost" id="migrate-content-btn" type="button" hidden>Update data</button>
          <button class="btn btn-ghost" id="refresh-homework-btn" type="button" data-i18n="builder.refresh">Refresh</button>
          <button class="btn btn-ghost" id="toggle-preview-btn" type="button" aria-pressed="true" data-i18n="builder.hide_preview">Hide preview</button>
          <button class="btn btn-ghost" id="load-template-btn" type="button" data-i18n="builder.load_template">Load Template</button>
          <button class="btn btn-ghost" id="test-tutor-btn" type="button" data-i18n-title="builder.test_tutor_title" title="Smoke-test the 4 AI tutor endpoints" data-i18n="builder.test_tutor">Test Tutor</button>
        </div>
      </header>

      <div class="builder-content" id="builder-content">
        <section class="editor-panel" aria-labelledby="active-phase-title">
          <div class="editor-card">
            <div class="editor-header">
              <div>
                <p class="eyebrow" id="active-phase-kicker" data-i18n="builder.phase_eyebrow">Phase</p>
                <h3 id="active-phase-title" data-i18n="common.loading">Loading…</h3>
              </div>
            </div>
            <div id="editor-root" aria-busy="true" aria-live="polite">
              <div class="loading-state loading-state--skeleton" id="builder-editor-skeleton">
                <span class="sr-only" data-i18n="builder.loading_editor">Loading editor…</span>
                <div class="skeleton-card skeleton-card--editor" aria-hidden="true">
                  <div class="skeleton-card__head">
                    <span class="skeleton-bar" style="width:42%"></span>
                    <span class="skeleton-pill"></span>
                  </div>
                  <span class="skeleton-line"></span>
                  <span class="skeleton-line"></span>
                  <span class="skeleton-line is-mid"></span>
                  <div class="skeleton-card__row" style="margin-top:8px">
                    <span class="skeleton-pill"></span>
                    <span class="skeleton-pill"></span>
                    <span class="skeleton-pill" style="width:140px"></span>
                  </div>
                  <span class="skeleton-line"></span>
                  <span class="skeleton-line is-mid"></span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="preview-panel" id="preview-panel" data-i18n-aria-label="builder.preview_aria" aria-label="Live preview">
          <iframe class="preview-frame" id="preview-frame" data-i18n-title="builder.preview_title" title="Homework preview"></iframe>
        </section>
      </div>
    </section>
  </main>

  <dialog class="modal" id="template-modal" aria-labelledby="template-modal-title">
    <div class="modal-card glass-card">
      <div class="modal-header">
        <div>
          <p class="eyebrow" data-i18n="builder.template_eyebrow">Fixture templates</p>
          <h2 id="template-modal-title" data-i18n="builder.template_h2">Load Template</h2>
        </div>
        <button class="icon-btn" id="close-template-modal" type="button" data-i18n-aria-label="builder.close_template_aria" aria-label="Close template modal">×</button>
      </div>

      <p class="muted-text" data-i18n="builder.template_desc">
        Select a fixture JSON to populate this homework. It will auto-save after loading.
      </p>

      <div class="fixture-list" id="fixture-list" data-i18n-aria-label="builder.fixture_list_aria" aria-label="Available fixture templates"></div>

      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancel-template" type="button" data-i18n="common.cancel">Cancel</button>
      </div>
    </div>
  </dialog>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

  <!-- Floating action button — follows the viewport so "Add X" is always reachable. -->
  <button class="fab-add" id="fab-add" type="button" hidden data-i18n-aria-label="builder.fab_add_aria" aria-label="Add item">
    <span class="fab-icon" aria-hidden="true">+</span>
    <span class="fab-label" data-i18n="builder.fab_add">Add</span>
  </button>

  <script src="/js/i18n/strings.js?v=__VERSION__"></script>
  <script src="/js/i18n.js?v=__VERSION__"></script>
  <script src="/js/api.js?v=__VERSION__"></script>
  <script src="/js/search-box.js?v=__VERSION__"></script>

  <script src="/js/editors/_paste-util.js?v=__VERSION__"></script>
  <script src="/js/editors/_rich-field.js?v=__VERSION__"></script>
  <script src="/js/editors/_quote-picker.js?v=__VERSION__"></script>
  <script src="/js/editors/_equation-symbols.js?v=__VERSION__"></script>
  <script src="/js/editors/_equation-picker.js?v=__VERSION__"></script>
  <script src="/js/editors/preview.js?v=__VERSION__"></script>
  <script src="/js/editors/flashcards.js?v=__VERSION__"></script>
  <script src="/js/editors/memory-sprint.js?v=__VERSION__"></script>

  <script src="/js/editors/games/adaptive-quiz.js?v=__VERSION__"></script>
  <script src="/js/editors/games/sentence-fill.js?v=__VERSION__"></script>
  <script src="/js/editors/games/tile-match.js?v=__VERSION__"></script>
  <script src="/js/editors/games/puzzle-lock.js?v=__VERSION__"></script>
  <script src="/js/editors/games/mystery-box.js?v=__VERSION__"></script>
  <script src="/js/editors/_ttt-helpers.js?v=__VERSION__"></script>
  <script src="/js/editors/games/ttt.js?v=__VERSION__"></script>
  <script src="/js/editors/_memory-palace-helpers.js?v=__VERSION__"></script>
  <script src="/js/editors/games/memory-palace.js?v=__VERSION__"></script>
  <script src="/js/editors/game-breaks.js?v=__VERSION__"></script>

  <script src="/js/editors/reading.js?v=__VERSION__"></script>
  <script src="/js/editors/real-life.js?v=__VERSION__"></script>
  <script src="/js/editors/_real-life-challenge-helpers.js?v=__VERSION__"></script>
  <script src="/js/editors/real-life-challenge.js?v=__VERSION__"></script>
  <script src="/js/editors/consolidation.js?v=__VERSION__"></script>
  <script src="/js/editors/_boss-helpers.js?v=__VERSION__"></script>
  <script src="/js/editors/boss.js?v=__VERSION__"></script>
  <script src="/js/editors/reflection.js?v=__VERSION__"></script>

  <script src="/js/builder.js?v=__VERSION__"></script>
</body>
</html>
